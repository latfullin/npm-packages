# Запасная публикация на npm: пакеты, чьей версии ещё нет в реестре (scripts/publish.mjs).
#
# Обычный путь релиза — Changesets, см. .github/workflows/release.yml. Этот workflow
# оставлен на случай, когда надо опубликовать в обход него: например, PR «Релиз» уже
# влит, а публикация упала. Поэтому только ручной запуск, по умолчанию dry run —
# автотриггер по тегу убран, чтобы две публикации не шли одновременно.
#
# Нужен секрет NPM_TOKEN: npmjs.com → Access Tokens → Granular, Read and write на пакеты, с обходом 2FA.
# Provenance включается сам, когда репозиторий станет публичным (для приватных npm его не принимает).
name: Publish (вручную)

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Только проверить, без публикации
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w packages
      # тесты каждого пакета запускает prepublishOnly перед публикацией
      - run: node scripts/publish.mjs ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
