# Сайт документации. Наружу портов не публикует: 80 и 443 держит глобальный прокси
# (проект ../proxy), он же терминирует https и выпускает сертификаты.
# Внутри сети web Caddy отдаёт статику по http.
#
# Запуск: сначала ../proxy/up.sh (создаёт сеть web), затем docker compose up -d
services:
  docs:
    build: .
    image: tinyval-docs
    container_name: tinyval-docs
    restart: unless-stopped
    networks: [web]
    environment:
      # :80 — слушаем http внутри сети. Домены и сертификаты теперь дело прокси,
      # поэтому Caddy к Let's Encrypt не обращается.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    name: web
    external: true
