services:
  docs:
    build: .
    image: tinyval-docs
    container_name: tinyval-docs
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      # Домены сайта. Caddy выпустит сертификат на каждый из них.
      SITE_ADDRESS: ${SITE_ADDRESS:-tinyval.ru, www.tinyval.ru}
    volumes:
      # Сертификаты Let's Encrypt — иначе при каждом перезапуске выпуск заново (у LE есть лимиты)
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
